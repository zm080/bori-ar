<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보리 AR</title>
<meta name="description" content="휴대폰 카메라로 캐릭터를 바닥에 올리거나 손으로 쓰다듬어 보는 웹 AR 프로토타입">
<!-- 손 모드에서 쓰는 3D 라이브러리 주소 -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  /* ===== 여기만 바꿔도 색이 바뀌어요 ===== */
  :root {
    --bg: #f4f1ea;
    --ink: #1f2430;
    --sub: #6b6f78;
    --accent: #e8743b;
    --accent2: #3f9e98;
    --accent-ink: #ffffff;
    --card: rgba(255, 255, 255, 0.92);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --ink: #eef0f3; --sub: #a3a8b2; --card: rgba(32, 35, 42, 0.92); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }

  header { padding: max(16px, env(safe-area-inset-top)) 16px 4px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; font-size: 14px; color: var(--sub); line-height: 1.45; }

  /* 3D 화면 + 숲 속 호수 배경 그림 */
  .stage { position: relative; flex: 1; min-height: 52vh; margin: 6px 12px 0; border-radius: 22px; overflow: hidden;
    background: #bfe6ff; box-shadow: 0 6px 20px rgba(0,0,0,.10); }
  @media (min-width: 800px) { .stage { width: 100%; max-width: 760px; align-self: center; } .modes { width: 100%; max-width: 784px; align-self: center; } }
  .stage .scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; --poster-color: transparent; background: transparent; }

  /* 로딩 바 */
  .progress { position: absolute; left: 16px; right: 16px; top: 50%; height: 6px; border-radius: 3px;
    background: rgba(127,127,127,.2); overflow: hidden; transition: opacity .3s; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .progress.done { opacity: 0; }

  /* 버튼 두 개 */
  .modes { display: flex; gap: 10px; padding: 8px 16px 10px; }
  .mode-btn { flex: 1; border: 0; border-radius: 16px; padding: 14px 10px; font-size: 16px; font-weight: 700;
    color: var(--accent-ink); box-shadow: 0 6px 18px rgba(0,0,0,.15); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: inherit; }
  .mode-btn small { font-size: 12px; font-weight: 500; opacity: .9; }
  .mode-btn svg { width: 24px; height: 24px; }
  .mode-btn:active { transform: scale(.97); }
  #flyBtn { background: var(--accent); }
  #handBtn { background: var(--accent2); }

  /* 안내 카드 */
  .notice { margin: 0 16px max(16px, env(safe-area-inset-bottom)); padding: 14px 16px; border-radius: 14px;
    background: var(--card); font-size: 14px; line-height: 1.55; display: none; }
  .notice.show { display: block; }
  .notice b { color: var(--accent); }
  .notice a.btn { display: inline-block; margin-top: 10px; padding: 10px 16px; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; }

  .tip { text-align: center; font-size: 13px; color: var(--sub); padding: 0 16px 4px; margin: 0; }

  /* ===== 손 모드 화면 ===== */
  #hand { position: fixed; inset: 0; background: #000; z-index: 50; display: none; overflow: hidden; }
  #hand.show { display: block; }
  #hand video, #hand canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hand video { object-fit: cover; }
  #hand .bar { position: absolute; left: 0; right: 0; top: 0; padding: max(14px, env(safe-area-inset-top)) 14px 14px;
    display: flex; align-items: flex-start; gap: 10px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
  #handStatus { flex: 1; color: #fff; font-size: 15px; line-height: 1.45; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #handClose { border: 0; border-radius: 999px; width: 44px; height: 44px; flex: none; background: rgba(255,255,255,.9);
    color: #1f2430; font-size: 22px; font-weight: 700; cursor: pointer; }
  #handMeter { position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: 160px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.3); overflow: hidden; }
  #handMeter > div { height: 100%; width: 0; background: #ff7aa2; transition: width .1s; }
</style>

  <h1>보리를 내 방에 불러오기</h1>
  <p>보리를 탭하면 톡 튀어 한 바퀴 날아요. 아래 버튼으로 모드를 골라 주세요.</p>
</header>

<script>
  // ---------- model-viewer 불러오기 (구글 CDN → 실패하면 다른 CDN) ----------
  (function loadMV() {
    const urls = [
      "https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js",
      "https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js",
      "https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"
    ];
    let i = 0;
    (function next() {
      if (i >= urls.length) { showNotice("<b>3D 뷰어를 불러오지 못했어요.</b><br>인터넷 연결을 확인하고 새로고침해 주세요."); return; }
      const s = document.createElement("script");
      s.type = "module"; s.src = urls[i++]; s.onerror = next;
      document.head.appendChild(s);
    })();
  })();

  const viewer = document.getElementById("viewer");
  const notice = document.getElementById("notice");
  const tip = document.getElementById("tip");
  function showNotice(html) { notice.innerHTML = html; notice.classList.add("show"); }

  // ---------- 로딩 바 ----------
  viewer.addEventListener("progress", (e) => {
    const p = e.detail.totalProgress;
    const bar = document.getElementById("progress");
    bar.firstElementChild.style.width = (p * 100) + "%";
    if (p >= 1) bar.classList.add("done");
  });
  viewer.addEventListener("error", () => showNotice("<b>모델 파일을 불러오지 못했어요.</b><br>파일 이름(src)이 맞는지 확인해 주세요."));

  // ---------- 카카오톡·인스타 등 앱 안 브라우저 대응 ----------
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const inApp = /KAKAOTALK|Instagram|FBAN|FBAV|NAVER\(inapp|Line\/|everytimeApp|DaumApps/i.test(ua);
  if (inApp) {
    if (isAndroid && /KAKAOTALK/i.test(ua)) {
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);   // 크롬으로 자동 이동
    }
    const target = isIOS ? "Safari" : "Chrome";
    showNotice(`<b>앱 안 브라우저에서는 AR·카메라가 안 열릴 수 있어요.</b><br>
      오른쪽 위(또는 아래) <b>⋯ 메뉴 → '${target}로 열기'</b>를 눌러 주세요.` +
      (isAndroid ? `<br><a class="btn" href="intent://${location.host}${location.pathname}#Intent;scheme=https;package=com.android.chrome;end">Chrome으로 열기</a>` : ""));
  }

  // ---------- 버튼 1: 날기 AR ----------
  document.getElementById("flyBtn").addEventListener("click", () => {
    if (viewer.canActivateAR) { viewer.activateAR(); return; }
    if (inApp) return;
    showNotice(isIOS || isAndroid
      ? "<b>이 브라우저에서는 AR을 쓸 수 없어요.</b><br>아이폰은 <b>Safari</b>, 안드로이드는 <b>Chrome</b>으로 열어 주세요. (3D로 돌려 보기는 지금도 가능해요)"
      : "<b>컴퓨터에서는 3D 미리보기만 돼요.</b><br>AR은 <b>휴대폰</b>으로 이 링크를 열어 주세요. ('손으로 쓰다듬기'는 웹캠으로 시험해 볼 수 있어요)");
  });
  // ---------- 탭하면 톡 튀어올라 한 바퀴 날기 ----------
  // (돌려 보기용으로 끌었을 때는 무시하고, 짧게 톡 친 것만 탭으로 봐요)
  let flying = false, down = null;
  function tapFly() {
    if (flying || !viewer.loaded) return;
    flying = true;
    viewer.animationName = "TapFly";
    viewer.currentTime = 0;
    viewer.play({ repetitions: 1 });
  }
  viewer.addEventListener("finished", () => {
    if (!flying) return;
    flying = false;
    viewer.animationName = "Idle";
    viewer.play();
  });
  viewer.addEventListener("pointerdown", (e) => { if (e.isPrimary) down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  viewer.addEventListener("pointerup", (e) => {
    if (!down || !e.isPrimary) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), held = performance.now() - down.t;
    down = null;
    if (moved < 12 && held < 450) tapFly();
  });

  viewer.addEventListener("ar-status", (e) => {
    if (e.detail.status === "failed") {
      showNotice("<b>AR을 시작하지 못했어요.</b><br>안드로이드는 'Google Play 서비스(AR)' 앱이 필요할 수 있어요. 밝은 곳에서 바닥 무늬가 보이게 다시 시도해 주세요.");
    }
  });
</script>

<!-- ===== 버튼 2: 손으로 쓰다듬기 ===== -->
<script type="module">
  // ---- 조절하기 쉬운 값들 ----
  const MODEL_URL   = "character.glb";
  const MP_VERSION  = "0.10.14";
  const MP_URL      = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
  const HAND_MODEL  = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  const PET_NEEDED  = 0.8;   // 몇 초 정도 쓰다듬으면 기뻐할지
  const LEAN_ANGLE  = 0.38;  // 손 쪽으로 기울이는 각도(라디안)

  const $ = (id) => document.getElementById(id);
  const overlay = $("hand"), video = $("handVideo"), canvas = $("handCanvas");
  const statusEl = $("handStatus"), meter = $("handMeter").firstElementChild;
  const say = (t) => { statusEl.textContent = t; };

  let THREE, renderer, scene, cam, mixer, idleAction, clock;
  let root, faceNormal, faceHappy, blush;
  let landmarker = null, stream = null, running = false, rafId = 0;
  let libsPromise = null;

  // ---------- 라이브러리 불러오기 (처음 한 번만) ----------
  function loadLibs() {
    if (libsPromise) return libsPromise;
    libsPromise = (async () => {
      const [three, gltf, vision] = await Promise.all([
        import("three"),
        import("three/addons/loaders/GLTFLoader.js"),
        import(`${MP_URL}/vision_bundle.mjs`)
      ]);
      THREE = three;
      setupScene(gltf.GLTFLoader);
      const files = await vision.FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
      const opts = (delegate) => ({
        baseOptions: { modelAssetPath: HAND_MODEL, delegate },
        runningMode: "VIDEO", numHands: 1,
        minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
      });
      try { landmarker = await vision.HandLandmarker.createFromOptions(files, opts("GPU")); }
      catch (e) { landmarker = await vision.HandLandmarker.createFromOptions(files, opts("CPU")); }
      await modelReady;
    })();
    libsPromise.catch(() => { libsPromise = null; });   // 실패하면 다음에 다시 시도
    return libsPromise;
  }

  // ---------- 3D 장면 ----------
  let modelReady;
  function setupScene(GLTFLoader) {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    scene = new THREE.Scene();
    cam = new THREE.PerspectiveCamera(40, 1, 0.01, 20);
    cam.position.set(0, 0.36, 1.6);
    cam.lookAt(0, 0.24, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.8);
    sun.position.set(0.6, 1.2, 1.0);
    scene.add(sun);
    // 바닥 그림자 대신 부드러운 동그라미
    const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.15, 40),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.001; shadow.scale.set(1, 0.6, 1);
    scene.add(shadow);
    clock = new THREE.Clock();

    modelReady = new Promise((resolve, reject) => {
      new GLTFLoader().load(MODEL_URL, (g) => {
        scene.add(g.scene);
        root       = g.scene.getObjectByName("Bori_Root");
        faceNormal = g.scene.getObjectByName("Face_Normal");
        faceHappy  = g.scene.getObjectByName("Face_Happy");
        blush      = g.scene.getObjectByName("Blush");
        mixer = new THREE.AnimationMixer(g.scene);
        const clip = THREE.AnimationClip.findByName(g.animations, "Idle") || g.animations[0];
        if (clip) { idleAction = mixer.clipAction(clip); idleAction.play(); }
        resolve();
      }, undefined, reject);
    });
    resize();
  }

  function resize() {
    if (!renderer) return;
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    cam.aspect = w / h;
    // 화면이 좁으면(세로) 조금 더 멀리서 보이게
    cam.fov = w < h ? 46 : 34;
    cam.updateProjectionMatrix();
  }
  addEventListener("resize", resize);

  // ---------- 카메라 켜기 ----------
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("nocam"), { name: "NoCamera" });
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; video.srcObject = null;
  }

  // ---------- 손 모드 열기 / 닫기 ----------
  async function openHand() {
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";
    if (!window.isSecureContext) {
      say("카메라는 https 주소에서만 켜져요. 깃허브 페이지 링크로 열어 주세요. (컴퓨터에선 localhost 주소도 돼요)");
      return;
    }
    say("카메라를 켜는 중이에요…");
    try {
      await startCamera();
    } catch (e) {
      say(e.name === "NotAllowedError" || e.name === "SecurityError"
        ? "카메라 권한이 꺼져 있어요. 주소창 옆 설정(아이폰: 'aA' → 웹 사이트 설정)에서 카메라를 허용하고 다시 눌러 주세요."
        : "카메라를 켤 수 없어요. 다른 앱이 카메라를 쓰고 있지 않은지 확인해 주세요.");
      return;
    }
    say("손 인식 준비 중이에요… (처음엔 몇 초 걸려요)");
    try {
      await loadLibs();
    } catch (e) {
      console.error(e);
      say("손 인식 프로그램을 불러오지 못했어요. 인터넷 연결을 확인하고 닫았다가 다시 눌러 주세요.");
      return;
    }
    if (!overlay.classList.contains("show")) return;   // 그 사이 닫았으면
    resize();
    resetMood();
    say("보리 머리 위에 손을 올리고 살살 쓰다듬어 주세요");
    running = true; clock.getDelta();
    loop();
  }
  function closeHand() {
    running = false; cancelAnimationFrame(rafId);
    stopCamera();
    overlay.classList.remove("show");
    document.body.style.overflow = "";
  }
  $("handBtn").addEventListener("click", openHand);
  $("handClose").addEventListener("click", closeHand);
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) closeHand(); });

  // ---------- 쓰다듬기 판정 + 기분 ----------
  let pet = 0;          // 쓰다듬은 정도 (0 ~ 1.6)
  let happy = false;    // 기뻐하는 중?
  let happyT = 0;       // 기뻐한 지 얼마나 됐는지 (단계 연출용)
  let side = 1;         // 손이 오른쪽(+1) / 왼쪽(-1)
  let lean = 0, rubPhase = 0, lastVideoTime = -1;
  let prevPalm = null, handSeen = false, senseAcc = 0;

  function resetMood() { pet = 0; happy = false; happyT = 0; lean = 0; prevPalm = null; applyMood(0); }

  // 카메라 화면 좌표(0~1) → 실제 화면 픽셀 (object-fit: cover 보정)
  function toScreen(lm) {
    const W = innerWidth, H = innerHeight, vw = video.videoWidth || W, vh = video.videoHeight || H;
    const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
    return { x: lm.x * dw + (W - dw) / 2, y: lm.y * dh + (H - dh) / 2 };
  }
  // 3D 위치 → 화면 픽셀
  function project(p) {
    const q = p.clone().project(cam);
    return { x: (q.x + 1) / 2 * innerWidth, y: (1 - q.y) / 2 * innerHeight };
  }

  function senseHand() {
    if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return null;
    lastVideoTime = video.currentTime;
    let res;
    try { res = landmarker.detectForVideo(video, performance.now()); } catch (e) { return null; }
    return res && res.landmarks && res.landmarks.length ? res.landmarks[0] : [];
  }

  function updatePet(lms, dt) {
    // 머리 쓰다듬는 영역: 보리 머리 위쪽 (기울지 않은 자세 기준)
    const c = project(new THREE.Vector3(0, 0.30, 0));
    const edge = project(new THREE.Vector3(0.20, 0.30, 0));
    const R = Math.abs(edge.x - c.x);
    let touching = false;
    if (lms && lms.length) {
      handSeen = true;
      // 손바닥 중심 + 손가락 끝
      const ids = [0, 5, 9, 13, 17, 4, 8, 12, 16, 20];
      const pts = ids.map((i) => toScreen(lms[i]));
      const palm = [0, 5, 9, 13, 17].map((i) => toScreen(lms[i]))
        .reduce((a, p) => ({ x: a.x + p.x / 5, y: a.y + p.y / 5 }), { x: 0, y: 0 });
      const near = pts.filter((p) => Math.hypot(p.x - c.x, (p.y - c.y) * 1.2) < R * 1.25).length;
      touching = near >= 2 || Math.hypot(palm.x - c.x, palm.y - c.y) < R * 1.1;
      let speed = 0;
      if (prevPalm && dt > 0) speed = Math.hypot(palm.x - prevPalm.x, palm.y - prevPalm.y) / dt / R;  // 머리 크기 기준 속도
      prevPalm = palm;
      if (touching) {
        // 머리에 손을 대고 움직이면 빨리, 가만히 올려만 둬도 천천히 차올라요
        pet += dt * (0.45 + Math.min(speed, 3) * 0.55);
        const dx = palm.x - c.x;
        if (Math.abs(dx) > R * 0.12) side = dx > 0 ? 1 : -1;
      }
    } else if (lms) {
      prevPalm = null;
    }
    if (!touching) pet -= dt * (happy ? 0.45 : 0.8);
    pet = Math.max(0, Math.min(1.6, pet));
    if (!happy && pet >= PET_NEEDED) happy = true;
    if (happy && pet <= 0.15) happy = false;
    return touching;
  }

  // 0~1 사이로 부드럽게
  const ease = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const pop  = (x) => { x = Math.max(0, Math.min(1, x)); return x < 1 ? 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2) : 1; };
  const setS = (o, s) => { if (o) o.scale.setScalar(Math.max(s, 1e-4)); };

  function applyMood(dt) {
    // 기뻐하는 단계: 0~0.35초 홍조 → 0.45초~ 눈웃음 → 0.85초~ 기울여서 비비기
    happyT = happy ? Math.min(happyT + dt, 5) : Math.max(happyT - dt * 2.2, 0);
    const kBlush = pop(happyT / 0.35);
    const kEyes  = ease((happyT - 0.45) / 0.15);
    const kRub   = ease((happyT - 0.85) / 0.45);
    setS(blush, kBlush);
    setS(faceHappy, kEyes);
    setS(faceNormal, 1 - kEyes);

    // 손 쪽으로 기울이기 + 비비기
    const target = -side * LEAN_ANGLE * kRub;     // 오른쪽 손이면 오른쪽(-z 회전)으로
    lean += (target - lean) * Math.min(1, dt * 6);
    rubPhase += dt * 9;
    if (root) {
      root.rotation.z = lean + Math.sin(rubPhase) * 0.075 * kRub;
      root.rotation.y = Math.sin(rubPhase * 0.5) * 0.10 * kRub - side * 0.12 * kRub;
      root.position.y = Math.abs(Math.sin(rubPhase)) * 0.008 * kRub;
    }
    // 기뻐할 땐 통통 뛰기를 줄여요
    if (idleAction) idleAction.setEffectiveWeight(1 - 0.85 * kRub);
  }

  function loop() {
    if (!running) return;
    rafId = requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.1);
    senseAcc += dt;
    const lms = senseHand();
    if (lms !== null) {
      const touching = updatePet(lms, Math.min(senseAcc, 0.2));
      senseAcc = 0;
      if (happy) say("기분 좋아요! 계속 쓰다듬어 주세요");
      else if (touching) say("살살… 조금만 더 쓰다듬어 주세요");
      else if (lms.length) say("손을 찾았어요. 보리 머리 위로 손을 가져가 보세요");
      else say(handSeen ? "손이 화면 밖으로 나갔어요" : "보리 머리 위에 손을 올리고 살살 쓰다듬어 주세요");
    }
    meter.style.width = Math.min(100, pet / PET_NEEDED * 100) + "%";
    if (mixer) mixer.update(dt);
    applyMood(dt);
    renderer.render(scene, cam);
  }
</script>
</body>
</html>
